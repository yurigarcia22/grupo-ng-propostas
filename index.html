<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Grupo NG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',sans-serif;
    background:#0D1117; color:#E6EDF3;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background-image:radial-gradient(ellipse at 50% 40%, #161B22 0%, #0D1117 70%);
  }
  .wrap { text-align:center; padding:40px 24px; max-width:520px; }
  .logo { width:72px; height:72px; object-fit:contain; margin:0 auto 32px; display:block; opacity:0.9; }
  h1 { font-size:34px; font-weight:900; letter-spacing:-1px; margin-bottom:14px; }
  h1 span {
    background:linear-gradient(135deg,#22c55e,#14b8a6);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  p { color:#8B949E; font-size:15px; line-height:1.7; margin-bottom:32px; }
  .cta {
    display:inline-block; text-decoration:none;
    background:linear-gradient(135deg,#22c55e,#14b8a6); color:#06231A;
    padding:13px 30px; border-radius:12px; font-size:14px; font-weight:800;
    transition:opacity .2s;
  }
  .cta:hover { opacity:0.88; }
  .foot { margin-top:40px; font-size:11px; color:#4b5563; letter-spacing:2px; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo-ng.png" alt="Grupo NG">
    <h1>Grupo <span>NG</span></h1>
    <p>
      Assessoria de performance e aquisição de clientes.<br>
      Se você chegou aqui procurando uma proposta, use o link que enviamos por mensagem.
    </p>
    <a class="cta" href="https://yurigarcia.vercel.app" target="_blank" rel="noopener">Falar com a gente</a>
    <div class="foot">Grupo NG</div>
  </div>
</body>
</html>
